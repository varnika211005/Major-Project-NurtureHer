name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
      - name: Deploy manifests
        run: |
          kubectl apply -f deployment/k8s/configmap.yaml
          kubectl apply -f deployment/k8s/secret.example.yaml --dry-run=client -o yaml
          kubectl apply -f deployment/k8s/api-deployment.yaml
          kubectl apply -f deployment/k8s/worker-deployment.yaml
          kubectl apply -f deployment/k8s/service.yaml
          kubectl apply -f deployment/k8s/ingress.yaml
          kubectl rollout status deployment/nurtureher-api

