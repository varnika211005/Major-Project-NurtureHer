services:
  api:
    command: sh scripts/docker/start_api.sh
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      METRICS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    command: sh scripts/docker/start_worker.sh
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO

  beat:
    build: .
    container_name: nurtureher-beat
    command: sh scripts/docker/start_beat.sh
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  db:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB

  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
