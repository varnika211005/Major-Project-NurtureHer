apiVersion: apps/v1
kind: Deployment
metadata:
  name: nurtureher-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nurtureher-api
  template:
    metadata:
      labels:
        app: nurtureher-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/nurtureher-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nurtureher-config
            - secretRef:
                name: nurtureher-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
