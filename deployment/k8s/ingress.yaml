apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nurtureher-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nurtureher-api
                port:
                  number: 80

