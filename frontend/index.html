<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8FA" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NurtureHer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>NurtureHer AI — Bridging Women's Health Gaps</title>
    <script>
      // Apply the persisted light/dark theme before first paint to avoid a flash.
      // Mirrors the precedence in @/theme/themeStore: canonical landing key,
      // then the two legacy keys. Only the class and a base colour are set here;
      // the full token set is applied by the theme store once the bundle loads.
      (function () {
        try {
          var k = "nurtureher_landing_theme";
          var raw = window.localStorage.getItem(k);
          var dark;
          if (raw === "1") dark = true;
          else if (raw === null) {
            dark =
              window.localStorage.getItem("nurtureher_theme") === "dark" ||
              window.localStorage.getItem("nurtureher-theme") === "dark";
          } else dark = false;
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.backgroundColor = dark ? "#1B1430" : "#FFF8FA";
        } catch (e) {
          /* storage unavailable — fall back to the light tokens in index.css */
        }
      })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
